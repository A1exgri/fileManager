services:

  app:
    build: .
    ports:
      - 8001:8001
    volumes:
      - ./images:/app/images
      - ./logs:/app/logs
    env_file: .env
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./images:/data/images
      - ./static:/data/static
      - ./logs:/var/log/nginx

  db:
    image: postgres:latest
    env_file: .env
    ports:
      - "5432: 5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: