services:

  app:
    build: .
    ports:
      - 8001:8001
    volumes:
      - ./images:/app/images
      - ./logs:/app/logs
    env_file: .env
    restart: always
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - logs/
            - images/
            - .git/

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./images:/data/images
      - ./static:/data/static
      - ./logs:/var/log/nginx

  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
    command: ["postgres", "-c", "log_statement=all"]

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: always
    depends_on:
      - db
    volumes:
      - ./pg_backups:/backups
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6

volumes:
  db_data:
  postgres_data: